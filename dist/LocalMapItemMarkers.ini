; Local Map Item Markers - an optional add-on to Local Map Upgrade.
;
; Marks nearby weapons, armour, containers and quest items on the local map. If Dragon's Eye
; Minimap is installed they appear on the minimap too, because that draws the same map.
;
; This file is read at startup and can be re-read from the settings page. Every value here matches
; the mod's own built-in default, so deleting a line changes nothing.

[Markers]

; What to mark. Turning a category off costs nothing - it is skipped while searching, not after.
bShowWeapons = true
bShowArmour = true
bShowContainers = true
bShowQuestItems = true

; How far from you something may be and still be marked, in feet. 0 means no limit, which is not
; recommended: everything in the loaded area is examined each time the map draws its markers.
uRadiusFeet = 150

; The most markers added in one go. Every marker is drawn separately, so a very high number costs
; frame rate and turns the map into clutter. Anything over the limit is counted and reported on the
; settings page rather than silently dropped.
uMaxMarkers = 60

[Debug]

; 0 trace, 1 debug, 2 info, 3 warning, 4 error, 5 critical, 6 off.
; Ships at 0 so a log sent with a bug report is already useful without changing anything first.
uLogLevel = 0
